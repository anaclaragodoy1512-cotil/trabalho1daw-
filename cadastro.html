	<h2 style="color:blueviolet;"><big>Formulário de Cadastro</big></h2>
	<br>

	<form>
		<fieldset>
			<legend><b><small>Cadastro</small></b></legend>

		<label for="nome">Nome:</label><br>
		<input type="text" name="nome" id="nome" required placeholder="Nome Completo" size="45">

		<br><br>

		<label for="idade">Idade:</label><br>
		<input type="number" name="idade" id="idade" min="14">

		<br><br>

		<label for="data">Data de Nascimento:</label><br>
		<input type="date" name="data" id="data">

		<br><br>

		<label for="email">E-mail:</label><br>
		<input type="email" name="email" id="email">

		</fieldset>

	<br>

	<input type="submit" value="Cadastrar" onclick="alert('Seu cadastro foi realizado com sucesso!!😉 Para mais informações acesse nossa loja')">


	
	</form>





</body>
</html>
